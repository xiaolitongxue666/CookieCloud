# CookieCloud — VPS 部署（环回 + Tailscale；禁止公网依赖 UFW 未放行 8088）
# 用法：TAILSCALE_IP=$(tailscale ip -4) docker compose -f Docker-compose.yml up -d
services:
  cookiecloud:
    image: easychen/cookiecloud:latest
    container_name: cookiecloud-app
    restart: unless-stopped
    environment:
      API_ROOT: /cookiecloud
    volumes:
      - ./data:/data/api/data
    ports:
      - "127.0.0.1:8088:8088"
      # 扩展直连用（避开 Nginx 对 Chrome gzip POST 的 408）；公网 UFW 默认不放行 8088
      - "${TAILSCALE_IP:?set TAILSCALE_IP}:8088:8088"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
